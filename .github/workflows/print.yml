name: Print this week's edition

on:
  schedule:
    - cron: "45 18 * * 0"  # Sunday 18:45 UTC = Monday 00:15 IST, newsroom.toml's time zone
  push:
    branches: [main]
    paths: ["newsroom.toml", "press/**", "!press/ledger.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: press

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the press
        run: python press/press.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deliver the edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets press/ledger.json
          if git diff --cached --quiet; then
            echo "Nothing new to print."
            exit 0
          fi
          git commit -m "Print this week's edition"
          git push
